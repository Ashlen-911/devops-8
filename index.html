<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Addition by Ashlen</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding-top: 100px; 
            background-color: #f4f7f6;
        }

        .container { 
            background: white;
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        input { 
            width: 80px; 
            padding: 10px; 
            border: 2px solid #ddd; 
            border-radius: 6px;
            font-size: 16px;
        }

        button { 
            padding: 10px 20px; 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }

        button:hover { background-color: #27ae60; }

        .output-area { margin-top: 20px; font-size: 20px; }
        
        #result { font-weight: bold; color: #333; }
        
        /* Styling for your name */
        #author { 
            display: block; 
            margin-top: 10px; 
            font-size: 14px; 
            color: #888; 
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Simple Adder</h3>
    <input type="number" id="num1" placeholder="0"> 
    <span>+</span>
    <input type="number" id="num2" placeholder="0">
    <button onclick="calculate()">Add</button>

    <div class="output-area">
        <span id="result">Total: 0</span>
        <span id="author"></span> </div>
</div>

<script>
    function calculate() {
        const val1 = parseFloat(document.getElementById('num1').value) || 0;
        const val2 = parseFloat(document.getElementById('num2').value) || 0;
        const sum = val1 + val2;

        // Update the result
        document.getElementById('result').innerText = "Total: " + sum;
        
        // Add your name after the addition
        document.getElementById('author').innerText = "— Calculated by Ashlen";
    }
</script>

</body>
</html>
